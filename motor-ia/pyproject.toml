[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "motor-ia"
version = "0.1.0"
description = "Paquete local para mejorar imágenes con un proveedor externo."
requires-python = ">=3.10"
dependencies = [
    "replicate==1.0.7",
    "Pillow==13.0.0",
    "python-dotenv==1.2.4",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0"]

[tool.setuptools.packages.find]
include = ["motor_ia*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
